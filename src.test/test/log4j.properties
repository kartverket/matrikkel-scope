##
# Log4J configuration used for the unit tests
##

log4j.rootCategory=INFO, Console
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=[%-5p %-25c{3} %-4L] %m%n

log4j.category.test=DEBUG

# Uncomment to debug all
#log4j.category.org.scopemvc=DEBUG

# Uncomment to debug all core
#log4j.category.org.scopemvc.core=DEBUG

# Uncomment to debug all controllers
#log4j.category.org.scopemvc.controller=DEBUG

# Uncomment to debug all models
#log4j.category.org.scopemvc.model=DEBUG

# Uncomment to debug all views
#log4j.category.org.scopemvc.view=DEBUG

# Uncomment to debug all utilities
#log4j.category.org.scopemvc.util=DEBUG

