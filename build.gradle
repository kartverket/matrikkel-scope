plugins {
  id 'java-library'
  id 'idea'
  id 'maven-publish'
}

group = 'no.kartverket.matrikkelscope'

version = projectVersion + System.getProperty('suffix', '-SNAPSHOT')

ext.with {
    // Versjonen angis i publish-jobb med GitHub actions
    projectVersion = properties.get('integration_version', '1.0.0')
}
project.version = "${projectVersion}"


java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
  main {
    java.srcDirs = ['src']
    resources {
      srcDirs = ['src']
      exclude '**/*.java'
    }
  }

  test {
    java.srcDirs = ['src.test']
    resources {
      srcDirs = ['src.test']
      exclude '**/*.java'
    }
  }
}

repositories {
    mavenCentral()
}

dependencies {
  implementation 'commons-logging:commons-logging:1.0.4'
  compileOnly 'javax.servlet:servlet-api:2.5' // provided
  compileOnly 'javax.servlet.jsp:jsp-api:2.1' // provided

  testImplementation 'junit:junit:3.8.2'
  testImplementation 'org.assertj:assertj-core:3.16.1'
  testImplementation files('lib/jfcunit.jar')
  testImplementation 'javax.servlet:servlet-api:2.5'
}


test {
  useJUnit()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

task sourceJar(type: Jar) {
  from sourceSets.main.allJava
  classifier 'sources'
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/kartverket/matrikkel-scope")
            credentials {
                username = project.findProperty("USERNAME") ?: System.getenv("USERNAME")
                password = project.findProperty("TOKEN") ?: System.getenv("TOKEN")
            }
        }
    }
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifact sourceJar
    }
  }
}


